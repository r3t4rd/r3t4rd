<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-76.0 -48.0 155.0 100.0" width="155" height="100"><defs></defs><style>
.a{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.jit{animation:jit .5s steps(1) infinite}
@keyframes jit{0%{transform:rotate(-2deg)}33%{transform:rotate(1.5deg) translate(1px,-1px)}66%{transform:rotate(-.5deg) translate(-1px,1px)}}
.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.55) rotate(0);opacity:.55}50%{transform:scale(1.12) rotate(20deg);opacity:1}}
.beat{animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(.96)}45%{transform:scale(1.08)}}
.sway{animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pop{animation:pop 2.4s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes pop{0%,60%{transform:scale(1)}70%{transform:scale(1.18) rotate(-4deg)}80%{transform:scale(.94)}90%,100%{transform:scale(1)}}
.flt{animation:flt 4s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(3px,-9px) rotate(5deg)}}
.d1{animation-delay:-.3s}.d2{animation-delay:-.7s}.d3{animation-delay:-1.1s}.d4{animation-delay:-1.5s}.d5{animation-delay:-1.9s}
